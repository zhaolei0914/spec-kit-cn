# 反模式规则配置
# 用于检测代码中的违规模式

# 格式：
# - id: 规则ID
#   pattern: 正则表达式
#   message: 错误消息
#   severity: error | warning | info
#   category: 分类

# 通用规则
general:
  - id: no-print
    pattern: '\bprint\s*\('
    message: 禁止使用 print()，请使用 logger
    severity: warning
    category: logging

  - id: no-bare-except
    pattern: 'except\s*:'
    message: 禁止裸 except，请指定异常类型
    severity: error
    category: exception

  - id: no-hardcoded-password
    pattern: "(password|passwd|pwd)\\s*=\\s*[\"'][^\"']+[\"']"
    message: 禁止硬编码密码
    severity: error
    category: security

  - id: no-eval
    pattern: '\beval\s*\('
    message: 禁止使用 eval()
    severity: error
    category: security

  - id: no-exec
    pattern: '\bexec\s*\('
    message: 禁止使用 exec()
    severity: error
    category: security

  - id: no-todo-fixme
    pattern: '#\s*(TODO|FIXME|XXX|HACK)'
    message: 发现未完成的代码标记
    severity: info
    category: quality

# Handler 规则
handler:
  - id: handler-no-direct-db
    pattern: '\.objects\.(create|update|delete|filter|get)'
    message: Handler 禁止直接操作数据库，请通过 Service 层
    severity: warning
    category: architecture
    file_pattern: '*/handler/*'

# Web 规则
web:
  - id: web-missing-formatting
    pattern: 'def (get|post|put|delete|patch)\(self'
    message: Web 接口缺少 @formatting 装饰器
    severity: warning
    category: convention
    file_pattern: '*/web/*'
    negative_pattern: '@formatting'

# Service 规则
service:
  - id: service-missing-transaction
    pattern: '\.save\(\)|\.delete\(\)'
    message: 数据库操作建议使用事务
    severity: info
    category: transaction
    file_pattern: '*/service/*'

# Model 规则
model:
  - id: model-missing-verbose-name
    pattern: 'models\.\w+Field\([^)]*\)'
    message: 模型字段建议添加 verbose_name
    severity: info
    category: documentation
    file_pattern: '*/models.py'
    negative_pattern: 'verbose_name'
